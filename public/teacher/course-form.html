<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Новый курс · Классный журнал</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="app-nav" id="app-nav"></nav>

  <div class="wrap">
    <a class="back-link" id="back-link" href="/teacher/courses.html">← Назад</a>

    <div class="page-head">
      <div>
        <p class="page-head__eyebrow" id="eyebrow">Новый курс</p>
        <h1 class="page-head__title" id="heading">Создать курс</h1>
      </div>
    </div>

    <ul class="error-list" id="form-errors" hidden></ul>

    <form class="form" id="course-form">
      <div class="field">
        <label class="field__label" for="title">Название курса</label>
        <input class="input" type="text" id="title" name="title" required>
      </div>

      <div class="field">
        <label class="field__label" for="description">Краткое описание</label>
        <textarea class="textarea" id="description" name="description" rows="2" placeholder="Одна-две строки для карточки курса"></textarea>
      </div>

      <div class="field">
        <label class="field__label" for="academicYear">Учебный год</label>
        <input class="input" type="text" maxlength="9" id="academicYear" name="academicYear" placeholder="Например: 2026-2027">
      </div>

      <div class="field">
        <span class="field__label">Обложка курса</span>
        <div class="file-field">
          <div class="file-field__current" id="current-cover" hidden></div>
          <input type="file" name="cover" id="cover" accept=".jpg,.jpeg,.png">
          <span class="field__hint">JPG / JPEG / PNG, до 50 МБ. Если не загрузить — будет стандартная заглушка.</span>
        </div>
      </div>

      <div class="field">
        <span class="field__label">Ученики курса</span>
        <div class="checkbox-grid checkbox-grid--list" id="students-grid">
          <span class="checkbox-grid__empty">Загрузка списка учеников…</span>
        </div>
        <span class="field__hint">Все отмеченные ученики сразу получат доступ ко всем урокам и заданиям курса</span>
      </div>

      <div class="form-actions">
        <button class="btn btn--red" type="submit" id="submit-btn">Создать курс</button>
        <a class="btn btn--ghost" href="/teacher/courses.html" id="cancel-link">Отмена</a>
      </div>
    </form>
  </div>


  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app-shell.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/teacher-course-form.js"></script>
</body>
</html>
